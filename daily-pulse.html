<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Pulse Post Generator</title>
  <style>
    :root {
      --bg:#07111f;
      --panel:rgba(255,255,255,.055);
      --border:rgba(255,255,255,.12);
      --text:#f4f7fb;
      --muted:#91a4bd;
      --green:#2ff58a;
      --orange:#ffb347;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at top left, rgba(47,245,138,.14), transparent 30%),
        radial-gradient(circle at top right, rgba(58,167,255,.12), transparent 32%),
        var(--bg);
      color:var(--text);
      font-family:Inter, Arial, sans-serif;
      padding:24px;
    }

    .wrap { max-width:900px; margin:auto; }

    .card {
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:24px;
      padding:24px;
      margin-bottom:18px;
      box-shadow:0 18px 50px rgba(0,0,0,.28);
    }

    h1 {
      margin:0 0 8px;
      font-size:clamp(34px, 6vw, 58px);
      line-height:1;
      letter-spacing:-2px;
    }

    p { color:var(--muted); }

    button {
      border:0;
      border-radius:999px;
      background:var(--green);
      color:#06101d;
      font-weight:900;
      padding:12px 18px;
      cursor:pointer;
      margin-right:8px;
      margin-top:8px;
    }

    button.secondary {
      background:rgba(255,255,255,.08);
      color:var(--text);
      border:1px solid var(--border);
    }

    textarea, pre {
      width:100%;
      min-height:230px;
      background:#020617;
      color:#d1fae5;
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px;
      font-size:15px;
      line-height:1.45;
      white-space:pre-wrap;
      overflow:auto;
    }

    .status {
      color:var(--orange);
      font-weight:800;
      margin-top:10px;
    }

    .small {
      font-size:13px;
      color:var(--muted);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Daily Pulse Generator</h1>
      <p>
        Private helper page. It creates a daily Diamond Pulse post where the featured weather game,
        hitter edge, pitcher watch, Power Ball, and Cold Note are connected when possible.
      </p>

      <button onclick="generateDailyPulse()">Generate Today's Post</button>
      <button class="secondary" onclick="copyPost()">Copy Post</button>
      <button class="secondary" onclick="downloadJson()">Download JSON</button>

      <div id="status" class="status">Ready.</div>
    </div>

    <div class="card">
      <h2>Post Text</h2>
      <textarea id="postText" readonly>Click "Generate Today's Post".</textarea>
    </div>

    <div class="card">
      <h2>JSON Data</h2>
      <pre id="jsonOutput">{}</pre>
      <p class="small">
        This page is intentionally not linked in your main navigation.
      </p>
    </div>
  </div>

<script>
const MLB = "https://statsapi.mlb.com/api/v1";
let dailyPulseData = null;

function nyDate(offsetDays = 0) {
  const ny = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
  ny.setDate(ny.getDate() + offsetDays);
  return ny.getFullYear() + "-" +
    String(ny.getMonth() + 1).padStart(2, "0") + "-" +
    String(ny.getDate()).padStart(2, "0");
}

function currentSeason() {
  return Number(nyDate().slice(0, 4));
}

async function getJson(url) {
  const sep = url.includes("?") ? "&" : "?";
  const res = await fetch(url + sep + "_=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("Could not load " + url);
  return await res.json();
}

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

function gameLabel(game) {
  return game.teams.away.team.name + " @ " + game.teams.home.team.name;
}

function shortGameLabel(game) {
  const away = game.teams.away.team.abbreviation || game.teams.away.team.teamName || game.teams.away.team.name;
  const home = game.teams.home.team.abbreviation || game.teams.home.team.teamName || game.teams.home.team.name;
  return away + " @ " + home;
}

function parseInnings(value) {
  if (!value) return 0;
  const [whole, part] = String(value).split(".");
  let innings = Number(whole || 0);
  if (part === "1") innings += 1 / 3;
  if (part === "2") innings += 2 / 3;
  return innings;
}

async function getTodaysGames() {
  const today = nyDate();
  const data = await getJson(
    MLB + "/schedule?sportId=1&date=" + today + "&hydrate=probablePitcher,venue,linescore"
  );

  const games = [];
  (data.dates || []).forEach(date => {
    (date.games || []).forEach(game => games.push(game));
  });

  return games;
}

async function getGameFeed(gamePk) {
  return await getJson("https://statsapi.mlb.com/api/v1.1/game/" + gamePk + "/feed/live");
}

async function findRecentFinalGames(maxDays = 8) {
  const finals = [];

  for (let i = 1; i <= maxDays && finals.length < 45; i++) {
    const date = nyDate(-i);
    const data = await getJson(MLB + "/schedule?sportId=1&date=" + date);

    (data.dates || []).forEach(day => {
      (day.games || []).forEach(game => {
        if (game.status && game.status.abstractGameState === "Final") {
          finals.push({ ...game, date });
        }
      });
    });
  }

  return finals;
}

function getTeamIdsForGame(game) {
  return new Set([
    String(game.teams.away.team.id),
    String(game.teams.home.team.id)
  ]);
}

async function getRecentHittersForGame(game, finals) {
  const teamIds = getTeamIdsForGame(game);
  const hitterMap = {};

  for (const finalGame of finals.slice(0, 35)) {
    try {
      const feed = await getGameFeed(finalGame.gamePk);
      const box = feed.liveData.boxscore;

      ["away", "home"].forEach(side => {
        const team = feed.gameData.teams[side];
        if (!teamIds.has(String(team.id))) return;

        Object.values(box.teams[side].players || {}).forEach(player => {
          const batting = player.stats && player.stats.batting;
          if (!batting) return;

          const hits = Number(batting.hits || 0);
          const hr = Number(batting.homeRuns || 0);
          const rbi = Number(batting.rbi || 0);

          if (hits <= 0 && hr <= 0 && rbi <= 0) return;

          const pid = player.person.id;

          if (!hitterMap[pid]) {
            hitterMap[pid] = {
              id: pid,
              name: player.person.fullName,
              team: team.name,
              teamId: team.id,
              game: shortGameLabel(game),
              hits: 0,
              hr: 0,
              rbi: 0,
              gamesWithHit: 0,
              score: 50
            };
          }

          hitterMap[pid].hits += hits;
          hitterMap[pid].hr += hr;
          hitterMap[pid].rbi += rbi;
          if (hits > 0) hitterMap[pid].gamesWithHit += 1;
        });
      });
    } catch (err) {
      console.warn("Skipping final game", finalGame.gamePk, err);
    }
  }

  const hitters = Object.values(hitterMap).map(row => {
    row.score = Math.min(99, Math.round(50 + row.hits * 4 + row.hr * 8 + row.rbi * 2 + row.gamesWithHit * 3));
    row.reason = `${row.hits} H, ${row.hr} HR, ${row.rbi} RBI in recent games`;
    return row;
  });

  hitters.sort((a, b) => b.score - a.score);
  return hitters;
}

async function getPitcherLogs(pitcherId) {
  try {
    const data = await getJson(
      MLB + "/people/" + pitcherId + "/stats?stats=gameLog&group=pitching&season=" + currentSeason()
    );

    const splits = [];
    (data.stats || []).forEach(block => {
      (block.splits || []).forEach(split => splits.push(split));
    });

    return splits.sort((a, b) => new Date(b.date) - new Date(a.date));
  } catch (err) {
    return [];
  }
}

async function getProbablePitchersForGame(game) {
  const pitchers = [];

  for (const side of ["away", "home"]) {
    const probable = game.teams[side].probablePitcher;
    if (!probable || !probable.id) continue;

    const team = game.teams[side].team;
    const opponent = side === "away" ? game.teams.home.team : game.teams.away.team;
    const logs = await getPitcherLogs(probable.id);
    const recent = logs.slice(0, 3);

    const ks = recent.reduce((sum, g) => sum + Number(g.stat?.strikeOuts || 0), 0);
    const innings = recent.reduce((sum, g) => sum + parseInnings(g.stat?.inningsPitched), 0);
    const er = recent.reduce((sum, g) => sum + Number(g.stat?.earnedRuns || 0), 0);

    pitchers.push({
      id: probable.id,
      name: probable.fullName,
      team: team.name,
      teamId: team.id,
      opponent: opponent.name,
      game: shortGameLabel(game),
      recentKs: ks,
      recentInnings: innings.toFixed(1),
      recentEr: er,
      score: Math.min(99, Math.round(50 + ks * 3 + Math.max(0, innings - er) * 1.5)),
      reason: `${ks} Ks across last ${recent.length || 0} starts`
    });
  }

  pitchers.sort((a, b) => b.score - a.score);
  return pitchers;
}

function scoreWeatherForHitters(weather) {
  let score = 0;
  const temp = Number(weather.temp || weather.temperature || 0);
  const wind = String(weather.wind || "").toLowerCase();
  const condition = String(weather.condition || "").toLowerCase();

  if (wind.includes("out")) score += 24;
  if (temp >= 80) score += 14;
  if (condition.includes("clear") || condition.includes("sun")) score += 6;
  if (wind.includes("in")) score -= 18;
  if (temp && temp <= 55) score -= 10;

  return score;
}

function scoreWeatherForPitchers(weather) {
  let score = 0;
  const temp = Number(weather.temp || weather.temperature || 0);
  const wind = String(weather.wind || "").toLowerCase();

  if (wind.includes("in")) score += 20;
  if (temp && temp <= 60) score += 10;
  if (wind.includes("out")) score -= 18;
  if (temp >= 82) score -= 10;

  return score;
}

async function buildGameContexts(games) {
  const finals = await findRecentFinalGames(8);
  const contexts = [];

  for (const game of games) {
    let weather = null;

    try {
      const feed = await getGameFeed(game.gamePk);
      weather = feed.gameData?.weather || null;
    } catch (err) {
      weather = null;
    }

    const hitters = await getRecentHittersForGame(game, finals);
    const pitchers = await getProbablePitchersForGame(game);

    const hitterWeather = weather ? scoreWeatherForHitters(weather) : 0;
    const pitcherWeather = weather ? scoreWeatherForPitchers(weather) : 0;

    const bestHitter = hitters[0]
      ? {
          ...hitters[0],
          weatherScore: hitterWeather,
          combinedScore: Math.max(1, Math.min(99, hitters[0].score + hitterWeather))
        }
      : null;

    const bestPitcher = pitchers[0]
      ? {
          ...pitchers[0],
          weatherScore: pitcherWeather,
          combinedScore: Math.max(1, Math.min(99, pitchers[0].score + pitcherWeather))
        }
      : null;

    const weatherText = weather
      ? `${shortGameLabel(game)} — ${weather.temp || weather.temperature || "?"}° ${weather.condition || ""} ${weather.wind || ""}`.trim()
      : `${shortGameLabel(game)} — weather unavailable`;

    const gameScore = Math.max(
      bestHitter ? bestHitter.combinedScore : 0,
      bestPitcher ? bestPitcher.combinedScore : 0
    ) + Math.abs(hitterWeather) + Math.abs(pitcherWeather);

    contexts.push({
      gamePk: game.gamePk,
      game: shortGameLabel(game),
      fullGame: gameLabel(game),
      status: game.status?.detailedState || "",
      weather,
      weatherText,
      hitterWeather,
      pitcherWeather,
      bestHitter,
      bestPitcher,
      gameScore
    });
  }

  contexts.sort((a, b) => b.gameScore - a.gameScore);
  return contexts;
}

async function getTeamStreaksForGames(games) {
  const todayTeamIds = new Set();
  games.forEach(game => {
    todayTeamIds.add(String(game.teams.away.team.id));
    todayTeamIds.add(String(game.teams.home.team.id));
  });

  const data = await getJson(MLB + "/standings?leagueId=103,104&season=" + currentSeason());
  const teams = [];

  (data.records || []).forEach(record => {
    (record.teamRecords || []).forEach(row => {
      if (!todayTeamIds.has(String(row.team.id))) return;

      const code = row.streak?.streakCode || "";
      const type = code.startsWith("W") ? "win" : code.startsWith("L") ? "loss" : "none";
      const number = Number(code.slice(1) || 0);

      teams.push({
        id: row.team.id,
        name: row.team.name,
        streak: code || "N/A",
        type,
        number
      });
    });
  });

  return {
    powerBall: teams.filter(t => t.type === "win").sort((a, b) => b.number - a.number)[0] || null,
    coldNote: teams.filter(t => t.type === "loss").sort((a, b) => b.number - a.number)[0] || null
  };
}

function pickPrimaryContext(contexts) {
  const weatherContexts = contexts.filter(ctx => ctx.weather);

  if (!weatherContexts.length) {
    return contexts[0] || null;
  }

  weatherContexts.sort((a, b) => {
    const aImpact = Math.max(Math.abs(a.hitterWeather), Math.abs(a.pitcherWeather));
    const bImpact = Math.max(Math.abs(b.hitterWeather), Math.abs(b.pitcherWeather));
    return bImpact - aImpact || b.gameScore - a.gameScore;
  });

  return weatherContexts[0];
}

function buildPost(data) {
  const ctx = data.primary_context;

  let mainEdgeLine = "🔥 Featured Edge\nNo clear player edge yet";

  if (ctx) {
    const useHitter =
      ctx.bestHitter &&
      (!ctx.bestPitcher || ctx.bestHitter.combinedScore >= ctx.bestPitcher.combinedScore);

    if (useHitter) {
      mainEdgeLine =
        `🔥 Featured Weather Edge\n${ctx.bestHitter.name} (${ctx.bestHitter.combinedScore}) — ${ctx.bestHitter.reason}`;
    } else if (ctx.bestPitcher) {
      mainEdgeLine =
        `🌊 Featured Weather Edge\n${ctx.bestPitcher.name} (${ctx.bestPitcher.combinedScore}) — ${ctx.bestPitcher.reason}`;
    }
  }

  const pitcherLine = data.top_pitcher
    ? `🌊 Pitcher Watch\n${data.top_pitcher.name} (${data.top_pitcher.combinedScore || data.top_pitcher.score}) — ${data.top_pitcher.reason}`
    : `🌊 Pitcher Watch\nNo probable pitcher edge yet`;

  const batterLine = data.top_batter
    ? `🔥 Batter Watch\n${data.top_batter.name} (${data.top_batter.combinedScore || data.top_batter.score}) — ${data.top_batter.reason}`
    : `🔥 Batter Watch\nNo clear batter edge yet`;

  const weatherLine = ctx
    ? `🌤 Weather Watch\n${ctx.weatherText}`
    : `🌤 Weather Watch\nNo major weather edge found yet`;

  const powerLine = data.power_ball
    ? `⚡ Power Ball\n${data.power_ball.name} ${data.power_ball.streak}`
    : `⚡ Power Ball\nNo active win-streak team found`;

  const coldLine = data.cold_note
    ? `❄️ Cold Note\n${data.cold_note.name} ${data.cold_note.streak}`
    : `❄️ Cold Note\nNo active cold streak found`;

  return `⚾ THE DIAMOND PULSE DAILY

${mainEdgeLine}

${batterLine}

${pitcherLine}

${powerLine}

${coldLine}

${weatherLine}

https://thediamondpulse.com`;
}

async function generateDailyPulse() {
  try {
    setStatus("Loading today's MLB schedule...");
    const games = await getTodaysGames();

    if (!games.length) {
      throw new Error("No MLB games found today.");
    }

    setStatus("Building connected player + weather game contexts...");
    const contexts = await buildGameContexts(games);

    const primaryContext = pickPrimaryContext(contexts);

    const allHitters = contexts
      .map(ctx => ctx.bestHitter)
      .filter(Boolean)
      .sort((a, b) => b.combinedScore - a.combinedScore);

    const allPitchers = contexts
      .map(ctx => ctx.bestPitcher)
      .filter(Boolean)
      .sort((a, b) => b.combinedScore - a.combinedScore);

    setStatus("Checking Power Ball and Cold Note...");
    const streaks = await getTeamStreaksForGames(games);

    dailyPulseData = {
      date: nyDate(),
      generated_at: new Date().toISOString(),
      primary_context: primaryContext,
      top_batter: allHitters[0] || null,
      top_pitcher: allPitchers[0] || null,
      power_ball: streaks.powerBall,
      cold_note: streaks.coldNote,
      site_url: "https://thediamondpulse.com"
    };

    const post = buildPost(dailyPulseData);

    document.getElementById("postText").value = post;
    document.getElementById("jsonOutput").textContent = JSON.stringify(dailyPulseData, null, 2);

    setStatus("Daily Pulse post generated with connected game/weather context.");
  } catch (err) {
    console.error(err);
    setStatus("Error: " + err.message);
  }
}

async function copyPost() {
  const text = document.getElementById("postText").value;
  await navigator.clipboard.writeText(text);
  setStatus("Copied post to clipboard.");
}

function downloadJson() {
  if (!dailyPulseData) {
    setStatus("Generate the post first.");
    return;
  }

  const blob = new Blob([JSON.stringify(dailyPulseData, null, 2)], {
    type: "application/json"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "daily-pulse.json";
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
