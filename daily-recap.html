<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Pulse Recap | The Diamond Pulse</title>
<style>
:root{--bg:#07111f;--panel:rgba(255,255,255,.055);--border:rgba(255,255,255,.12);--text:#f4f7fb;--muted:#91a4bd;--green:#2ff58a;--orange:#ffb347;--red:#ff5f6d;--blue:#3aa7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,rgba(47,245,138,.14),transparent 32%),radial-gradient(circle at top right,rgba(58,167,255,.12),transparent 34%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;padding:24px}.wrap{max-width:1100px;margin:auto}a{color:var(--green);text-decoration:none;font-weight:900}.hero,.card{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:0 18px 45px rgba(0,0,0,.24)}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}h1{margin:0;font-size:clamp(38px,7vw,72px);line-height:1;letter-spacing:-2px}h2{margin:0 0 14px;font-size:24px}.muted{color:var(--muted)}button{border:0;border-radius:999px;background:var(--green);color:#06101d;font-weight:900;padding:12px 18px;cursor:pointer;margin-right:8px;margin-top:8px}button.secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{font-size:36px;font-weight:950;color:var(--green);line-height:1}.label{color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;margin-top:7px;letter-spacing:.06em}.player-card{background:rgba(255,255,255,.045);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:14px}.player-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.player-name{font-size:22px;font-weight:950;line-height:1.05}.score{min-width:76px;text-align:center;border-radius:999px;padding:9px 12px;background:rgba(47,245,138,.12);border:1px solid rgba(47,245,138,.3);color:var(--green);font-weight:950;font-family:monospace}.grade{display:inline-block;border-radius:999px;padding:8px 12px;font-weight:950;margin-top:10px;text-transform:uppercase;letter-spacing:.04em}.smash{background:rgba(47,245,138,.14);border:1px solid rgba(47,245,138,.35);color:var(--green)}.hit{background:rgba(58,167,255,.12);border:1px solid rgba(58,167,255,.32);color:#93cfff}.push{background:rgba(255,179,71,.12);border:1px solid rgba(255,179,71,.32);color:var(--orange)}.miss{background:rgba(255,95,109,.12);border:1px solid rgba(255,95,109,.32);color:#ffb4bc}.statline{color:var(--muted);margin-top:8px;font-size:14px;line-height:1.45}.reason{color:#d1fae5;margin-top:10px;line-height:1.45;font-size:14px}textarea{width:100%;min-height:330px;background:#020617;color:#d1fae5;border:1px solid var(--border);border-radius:18px;padding:16px;font-size:15px;line-height:1.45;white-space:pre-wrap}.empty{color:var(--muted);padding:18px;border:1px dashed var(--border);border-radius:16px;background:rgba(255,255,255,.025)}@media(max-width:900px){body{padding:14px}.grid{grid-template-columns:1fr}.player-top{display:block}.score{display:inline-block;margin-top:12px}}
</style>
</head>
<body>
<div class="wrap">
<p><a href="index.html">← Back to Diamond Pulse</a> · <a href="daily-pulse.html">Open Daily Pulse Generator</a></p>
<section class="hero"><div><h1>📊 Daily Pulse Recap</h1><p class="muted">Grade the saved Batters Edge and Round the Mound players after games finish.</p></div><div><button onclick="loadRecap()">Refresh Recap</button><button class="secondary" onclick="copyRecapPost()">Copy Recap Post</button></div></section>
<section class="grid"><div class="card"><div id="recapDate" class="stat">-</div><div class="label">Saved Pulse Date</div></div><div class="card"><div id="hitRate" class="stat">-</div><div class="label">Hit Rate</div></div><div class="card"><div id="smashCount" class="stat">-</div><div class="label">Smashes</div></div></section>
<section class="card"><h2>⚡ Batters Edge Results</h2><div id="batterResults">Loading...</div></section>
<section class="card"><h2>🎯 Round the Mound Results</h2><div id="pitcherResults">Loading...</div></section>
<section class="card"><h2>X Recap Post</h2><textarea id="recapPost" readonly>Run the recap first.</textarea></section>
</div>
<script>
const MLB="https://statsapi.mlb.com/api/v1";function currentSeason(){return new Date().getFullYear()}function h(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}async function getJson(u){const s=u.includes("?")?"&":"?";const r=await fetch(u+s+"_="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("Could not load "+u);return await r.json()}function saved(){try{return JSON.parse(localStorage.getItem("diamondPulseSavedDailyPulse")||"null")}catch{return null}}
async function logs(id,group){try{const d=await getJson(MLB+"/people/"+id+"/stats?stats=gameLog&group="+group+"&season="+currentSeason());const out=[];(d.stats||[]).forEach(b=>(b.splits||[]).forEach(s=>out.push({date:s.date,opponent:s.opponent?.name||"",stat:s.stat||{}})));return out.sort((a,b)=>new Date(b.date)-new Date(a.date))}catch{return[]}}
function pick(gs,date){return gs.find(g=>g.date===date)||gs[0]||null}function gradeB(g){if(!g)return{grade:"PENDING",cls:"push",text:"No final game log found yet.",hit:false,smash:false};const hits=Number(g.stat.hits||0),hr=Number(g.stat.homeRuns||0),rbi=Number(g.stat.rbi||0),runs=Number(g.stat.runs||0),tb=Number(g.stat.totalBases||0),bb=Number(g.stat.baseOnBalls||0);if(hr>=1||hits>=2||tb>=4)return{grade:"SMASH",cls:"smash",text:`${hits} H, ${hr} HR, ${rbi} RBI, ${tb} TB`,hit:true,smash:true};if(hits>=1||rbi>=1||runs>=1||bb>=2)return{grade:"HIT",cls:"hit",text:`${hits} H, ${hr} HR, ${rbi} RBI, ${runs} R`,hit:true,smash:false};return{grade:"MISS",cls:"miss",text:`${hits} H, ${hr} HR, ${rbi} RBI, ${tb} TB`,hit:false,smash:false}}
function ip(v){if(!v)return 0;const [w,p]=String(v).split(".");let i=Number(w||0);if(p==="1")i+=1/3;if(p==="2")i+=2/3;return i}function gradeP(g){if(!g)return{grade:"PENDING",cls:"push",text:"No final game log found yet.",hit:false,smash:false};const ks=Number(g.stat.strikeOuts||0),er=Number(g.stat.earnedRuns||0),inn=ip(g.stat.inningsPitched),txt=g.stat.inningsPitched||"0.0";if(ks>=8&&er<=2)return{grade:"SMASH",cls:"smash",text:`${txt} IP, ${ks} K, ${er} ER`,hit:true,smash:true};if(ks>=6||(inn>=6&&er<=2))return{grade:"HIT",cls:"hit",text:`${txt} IP, ${ks} K, ${er} ER`,hit:true,smash:false};if(ks>=5&&er<=3)return{grade:"PUSH",cls:"push",text:`${txt} IP, ${ks} K, ${er} ER`,hit:false,smash:false};return{grade:"MISS",cls:"miss",text:`${txt} IP, ${ks} K, ${er} ER`,hit:false,smash:false}}
function name(p){return p.name||p.player_name||p.fullName||"Player"}async function bres(p,d){const g=pick(await logs(p.id,"hitting"),d);return{type:"batter",player:p,game:g,grade:gradeB(g)}}async function pres(p,d){const g=pick(await logs(p.id,"pitching"),d);return{type:"pitcher",player:p,game:g,grade:gradeP(g)}}function render(r){const p=r.player,g=r.grade,gm=r.game,opp=gm?.opponent?"vs "+gm.opponent:(p.game||"");return `<div class="player-card"><div class="player-top"><div><div class="player-name"><a href="player.html?id=${h(p.id)}&reason=daily-recap">${h(name(p))}</a></div><div class="muted">${h(p.team||"")} · ${h(opp)}</div></div><div class="score">${h(p.score||"-")}</div></div><span class="grade ${h(g.cls)}">${h(g.grade)}</span><div class="reason">Result: ${h(g.text)}</div><div class="statline">Original reason: ${h(p.reason||(p.signals||[]).join(" • ")||"Daily Pulse edge")}</div></div>`}
function post(date,bs,ps,rate,sm){const bl=bs.map(r=>`${r.grade.grade==="SMASH"?"✅🔥":r.grade.grade==="HIT"?"✅":r.grade.grade==="PUSH"?"➖":"❌"} ${name(r.player)}: ${r.grade.text} — ${r.grade.grade}`).join("\n");const pl=ps.map(r=>`${r.grade.grade==="SMASH"?"✅🔥":r.grade.grade==="HIT"?"✅":r.grade.grade==="PUSH"?"➖":"❌"} ${name(r.player)}: ${r.grade.text} — ${r.grade.grade}`).join("\n");return `📊 DIAMOND PULSE RECAP\n${date}\n\n⚡ Batters Edge\n${bl||"No batter results yet."}\n\n🎯 Round the Mound\n${pl||"No pitcher results yet."}\n\nHit Rate: ${rate}\nSmashes: ${sm}\n\nFull board ⬇️\nhttps://thediamondpulse.com`}
async function loadRecap(){const s=saved();if(!s){document.getElementById("batterResults").innerHTML="<div class='empty'>No saved Daily Pulse found. Open daily-pulse.html, generate posts, then click Save Today’s Pulse.</div>";document.getElementById("pitcherResults").innerHTML="";return}const d=s.date;document.getElementById("recapDate").textContent=d?d.slice(5):"-";document.getElementById("batterResults").innerHTML="<div class='empty'>Checking batter results...</div>";document.getElementById("pitcherResults").innerHTML="<div class='empty'>Checking pitcher results...</div>";const bs=[],ps=[];for(const p of s.top_batters||[])try{bs.push(await bres(p,d))}catch(e){}for(const p of s.top_pitchers||[])try{ps.push(await pres(p,d))}catch(e){}document.getElementById("batterResults").innerHTML=bs.length?bs.map(render).join(""):"<div class='empty'>No batter results found.</div>";document.getElementById("pitcherResults").innerHTML=ps.length?ps.map(render).join(""):"<div class='empty'>No pitcher results found.</div>";const all=bs.concat(ps),graded=all.filter(r=>r.grade.grade!=="PENDING"),hits=graded.filter(r=>r.grade.hit).length,sm=graded.filter(r=>r.grade.smash).length,rate=graded.length?Math.round(hits/graded.length*100)+"%":"-";document.getElementById("hitRate").textContent=rate;document.getElementById("smashCount").textContent=sm;document.getElementById("recapPost").value=post(d,bs,ps,rate,sm)}
async function copyRecapPost(){await navigator.clipboard.writeText(document.getElementById("recapPost").value);alert("Copied recap post.")}loadRecap().catch(console.error);
</script>
</body>
</html>
