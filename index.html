<script>
let authMode = "login";

function showLogin() {
  authMode = "login";
  document.getElementById("authModal").style.display = "flex";
  document.getElementById("authTitle").innerText = "Log In";
  document.getElementById("authSubmit").innerText = "Log In";
}

function showSignup() {
  authMode = "signup";
  document.getElementById("authModal").style.display = "flex";
  document.getElementById("authTitle").innerText = "Create Account";
  document.getElementById("authSubmit").innerText = "Create Account";
}

function closeAuthModal() {
  document.getElementById("authModal").style.display = "none";
}

document.getElementById("authSubmit").addEventListener("click", async () => {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value.trim();

  let result;

  if (authMode === "signup") {
    result = await supabaseClient.auth.signUp({
      email,
      password
    });
  } else {
    result = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });
  }

  if (result.error) {
    alert(result.error.message);
    return;
  }

  alert(authMode === "signup" ? "Account created!" : "Logged in!");

  closeAuthModal();
  checkUser();
});

async function logoutUser() {
  await supabaseClient.auth.signOut();
  checkUser();
}

async function checkUser() {
  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  const logoutBtn = document.getElementById("logoutBtn");

  if (user) {
    logoutBtn.style.display = "inline-block";
  } else {
    logoutBtn.style.display = "none";
  }
}

checkUser();
</script>
