<script>
if(!window.__diamondPulseOpposingPitchersAdded){
  window.__diamondPulseOpposingPitchersAdded = true;

  const oldDetailsHtml = window.detailsHtml;

  function buildOpposingPitcherBoxscore(row){
    if(!row.opposingPitchers || !row.opposingPitchers.length){
      return "";
    }

    return (
      '<div class="details-header">Opposing pitcher boxscore</div>' +
      '<div class="details-grid">' +
        row.opposingPitchers.map(p =>
          '<div class="detail-chip">' +
            '<div class="detail-name">' + h(p.name) + '</div>' +
            '<div class="detail-sub">' + h(row.opposingPitcherTeam || "Pitching team") + '</div>' +
            '<div class="detail-stat">' + h(p.inningsPitched) + ' IP</div>' +
            '<div class="detail-stat">' + h(p.strikeOuts) + ' K</div>' +
            '<div class="detail-stat">' + h(p.hits) + ' H</div>' +
            '<div class="detail-stat">' + h(p.earnedRuns) + ' ER</div>' +
            '<div class="detail-stat">' + h(p.baseOnBalls) + ' BB</div>' +
            '<div class="detail-stat">' + h(p.numberOfPitches) + ' P</div>' +
            '<div class="detail-stat">' + h(p.strikes) + ' Strikes</div>' +
            '<div class="detail-stat">' + h(p.battersFaced) + ' BF</div>' +
          '</div>'
        ).join("") +
      '</div>'
    );
  }

  window.detailsHtml = function(row, detailsType){
    if(detailsType === "teamks"){
      return (
        '<div class="details-header">Team strikeout + whiff detail</div>' +
        '<div class="details-grid">' +
          statChip("Team Strikeouts", row.value) +
          statChip("Whiff%", (row.whiffPct || "0.0") + "%") +
          statChip("Misses", row.misses || 0) +
          statChip("Swings", row.swings || 0) +
          statChip("Pitching Team", row.opposingPitcherTeam || "") +
        '</div>' +
        buildOpposingPitcherBoxscore(row)
      );
    }

    return oldDetailsHtml(row, detailsType);
  };

  detailsHtml = window.detailsHtml;

  window.loadPreviousGameDayStats = async function(){
    const previous = await findPreviousCompletedGameDay();
    const pitchMap = await getPitchCodeMap();

    let prevKs = [];
    let prevHits = [];

    for(const game of previous.games){
      const live = await getJson("https://statsapi.mlb.com/api/v1.1/game/" + game.gamePk + "/feed/live");
      const box = live.liveData.boxscore;
      const whiffStats = computeTeamWhiffStats(live, pitchMap);

      ["away","home"].forEach(side => {
        const opponentSide = side === "away" ? "home" : "away";

        const team = game.teams[side].team;
        const opponent = game.teams[opponentSide].team;
        const battingStats = box.teams[side].teamStats.batting;

        const teamKs = Number(battingStats.strikeOuts || 0);
        const teamHits = Number(battingStats.hits || 0);

        const whiff = whiffStats[team.id] || {
          swings: 0,
          misses: 0,
          whiffPct: "0.0"
        };

        let players = [];
        Object.values(box.teams[side].players || {}).forEach(player => {
          const batting = player.stats && player.stats.batting;

          if(batting && Number(batting.hits || 0) > 0){
            players.push({
              name: player.person.fullName,
              hits: Number(batting.hits || 0)
            });
          }
        });

        players.sort((a,b) => b.hits - a.hits);

        let opposingPitchers = [];
        Object.values(box.teams[opponentSide].players || {}).forEach(player => {
          const pitching = player.stats && player.stats.pitching;
          if(!pitching) return;

          const inningsPitched = pitching.inningsPitched || "0.0";
          const strikeOuts = Number(pitching.strikeOuts || 0);
          const battersFaced = Number(pitching.battersFaced || 0);
          const numberOfPitches = Number(pitching.numberOfPitches || 0);

          const actuallyPitched =
            inningsPitched !== "0.0" ||
            strikeOuts > 0 ||
            battersFaced > 0 ||
            numberOfPitches > 0;

          if(!actuallyPitched) return;

          opposingPitchers.push({
            name: player.person.fullName,
            inningsPitched,
            strikeOuts,
            hits: Number(pitching.hits || 0),
            runs: Number(pitching.runs || 0),
            earnedRuns: Number(pitching.earnedRuns || 0),
            baseOnBalls: Number(pitching.baseOnBalls || 0),
            numberOfPitches,
            strikes: Number(pitching.strikes || 0),
            battersFaced
          });
        });

        opposingPitchers.sort((a,b) =>
          b.strikeOuts - a.strikeOuts ||
          b.numberOfPitches - a.numberOfPitches
        );

        prevKs.push({
          value: teamKs,
          name: team.name,
          team: "vs " + opponent.name,
          game: gameLabel(game),
          status: previous.dateString,
          teamId: team.id,
          whiffPct: whiff.whiffPct,
          swings: whiff.swings,
          misses: whiff.misses,
          opposingPitcherTeam: opponent.name,
          opposingPitchers,
          extra: teamKs + " team strikeouts · Whiff%: " + whiff.whiffPct + "%"
        });

        prevHits.push({
          value: teamHits,
          name: team.name,
          team: "vs " + opponent.name,
          game: gameLabel(game),
          status: previous.dateString,
          teamId: team.id,
          players
        });
      });
    }

    prevKs.sort((a,b) => b.value - a.value);
    prevHits.sort((a,b) => b.value - a.value);

    appState.prevKs = prevKs;
    appState.prevHits = prevHits;

    renderAllData();
  };

  loadPreviousGameDayStats().catch(err => {
    console.error("Opposing pitcher boxscore refresh failed:", err);
  });
}
</script>
