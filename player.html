<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Breakdown | Diamond Pulse</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(255,255,255,0.055);
      --border: rgba(255,255,255,0.1);
      --text: #f4f7fb;
      --muted: #91a4bd;
      --green: #2ff58a;
      --blue: #3aa7ff;
      --orange: #ffb347;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(47,245,138,0.14), transparent 32%),
        radial-gradient(circle at top right, rgba(58,167,255,0.12), transparent 34%),
        var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
    }

    a {
      color: var(--green);
      text-decoration: none;
      font-weight: 800;
    }

    .hero,
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.24);
    }

    .hero {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 20px;
      align-items: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ecfdf5;
      padding: 10px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 60px);
      line-height: 1;
      letter-spacing: -2px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 24px;
    }

    .muted {
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .stat {
      font-size: 34px;
      font-weight: 900;
      color: var(--green);
      line-height: 1;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 7px;
    }

    .reason {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(47,245,138,0.1);
      border: 1px solid rgba(47,245,138,0.25);
      margin-top: 10px;
      font-weight: 800;
    }

    .reason.orange {
      background: rgba(255,179,71,0.1);
      border-color: rgba(255,179,71,0.3);
      color: #ffe0ad;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th,
    td {
      padding: 13px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .pill {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(47,245,138,0.1);
      border: 1px solid rgba(47,245,138,0.22);
      color: var(--green);
      font-weight: 900;
      font-size: 12px;
      margin-top: 10px;
    }

    @media (max-width: 800px) {
      body { padding: 14px; }

      .hero,
      .grid {
        grid-template-columns: 1fr;
      }

      .logo {
        width: 76px;
        height: 76px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <p><a href="index.html">← Back to Diamond Pulse</a></p>

    <section id="playerHero" class="hero">
      <div class="muted">Loading player...</div>
    </section>

    <section class="card">
      <h2>Why This Player Is Highlighted</h2>
      <div id="reasons"></div>
    </section>

    <section class="grid">
      <div class="card">
        <div id="games" class="stat">-</div>
        <div class="label">Recent Games</div>
      </div>

      <div class="card">
        <div id="hits" class="stat">-</div>
        <div class="label">Recent Hits</div>
      </div>

      <div class="card">
        <div id="strikeouts" class="stat">-</div>
        <div class="label">Recent Strikeouts</div>
      </div>
    </section>

    <section class="card">
      <h2>Recent Game Log</h2>
      <div id="gameLog">Loading stats...</div>
    </section>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const playerId = params.get("id");
    const reasonFromLink = params.get("reason");

    function h(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function currentSeason() {
      return new Date().getFullYear();
    }

    async function getJson(url) {
      const sep = url.includes("?") ? "&" : "?";
      const res = await fetch(url + sep + "_=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("Could not load " + url);
      return await res.json();
    }

    async function loadStatGroup(group) {
      const url = "https://statsapi.mlb.com/api/v1/people/" + playerId +
        "/stats?stats=gameLog&group=" + group + "&season=" + currentSeason();

      try {
        const data = await getJson(url);
        const splits = [];

        (data.stats || []).forEach(statBlock => {
          (statBlock.splits || []).forEach(split => {
            splits.push({
              group,
              date: split.date,
              opponent: split.opponent?.name || "Opponent",
              stat: split.stat || {}
            });
          });
        });

        return splits;
      } catch (err) {
        console.warn("Could not load " + group + " stats", err);
        return [];
      }
    }

    async function loadPlayer() {
      if (!playerId) {
        document.getElementById("playerHero").innerHTML = "<div>No player ID found.</div>";
        return;
      }

      const personUrl = "https://statsapi.mlb.com/api/v1/people/" + playerId + "?hydrate=currentTeam";
      const personData = await getJson(personUrl);
      const player = personData.people[0];
      const team = player.currentTeam || {};
      const teamLogo = team.id ? "https://www.mlbstatic.com/team-logos/" + team.id + ".svg" : "";

      document.title = player.fullName + " | Diamond Pulse";

      document.getElementById("playerHero").innerHTML = `
        <img class="logo" src="${teamLogo}" alt="">
        <div>
          <h1>${h(player.fullName)}</h1>
          <p class="muted">${h(team.name || "MLB Player")} · ${h(player.primaryPosition?.name || "")}</p>
          ${reasonFromLink ? `<div class="pill">${h(reasonFromLink.replaceAll("-", " "))}</div>` : ""}
        </div>
      `;

      const hittingSplits = await loadStatGroup("hitting");
      const pitchingSplits = await loadStatGroup("pitching");

      const allSplits = hittingSplits.concat(pitchingSplits)
        .sort((a, b) => new Date(b.date) - new Date(a.date));

      const recent = allSplits.slice(0, 8);

      const totalHits = recent.reduce((sum, game) => sum + Number(game.stat.hits || 0), 0);
      const totalKs = recent.reduce((sum, game) => sum + Number(game.stat.strikeOuts || 0), 0);

      document.getElementById("games").textContent = recent.length;
      document.getElementById("hits").textContent = totalHits;
      document.getElementById("strikeouts").textContent = totalKs;

      const reasons = [];

      if (reasonFromLink) {
        reasons.push("⭐ Diamond Pulse highlighted this player for: " + reasonFromLink.replaceAll("-", " ") + ".");
      }

      if (totalHits >= 5) {
        reasons.push("🔥 Hot Bat: strong recent hit production.");
      }

      if (totalKs >= 8) {
        reasons.push("🌊 Strikeout Watch: high recent strikeout activity.");
      }

      const hitStreak = countHitStreak(hittingSplits.slice(0, 8));

      if (hitStreak >= 3) {
        reasons.push("💗 Hit Streak: hit in " + hitStreak + " straight recent games.");
      }

      if (!reasons.length) {
        reasons.push("📊 This player was selected from the Diamond Pulse board. Recent stats are shown below.");
      }

      document.getElementById("reasons").innerHTML = reasons
        .map((reason, index) => `<div class="reason ${index === 0 && reasonFromLink ? "orange" : ""}">${h(reason)}</div>`)
        .join("");

      document.getElementById("gameLog").innerHTML = buildGameLog(recent);
    }

    function buildGameLog(games) {
      if (!games.length) {
        return "<p class='muted'>No current season game log found yet.</p>";
      }

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Opponent</th>
                <th>AB</th>
                <th>H</th>
                <th>HR</th>
                <th>RBI</th>
                <th>K</th>
                <th>IP</th>
                <th>ER</th>
              </tr>
            </thead>
            <tbody>
              ${games.map(game => `
                <tr>
                  <td>${h(game.date)}</td>
                  <td>${h(game.group)}</td>
                  <td>${h(game.opponent)}</td>
                  <td>${h(game.stat.atBats ?? "-")}</td>
                  <td>${h(game.stat.hits ?? "-")}</td>
                  <td>${h(game.stat.homeRuns ?? "-")}</td>
                  <td>${h(game.stat.rbi ?? "-")}</td>
                  <td>${h(game.stat.strikeOuts ?? "-")}</td>
                  <td>${h(game.stat.inningsPitched ?? "-")}</td>
                  <td>${h(game.stat.earnedRuns ?? "-")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function countHitStreak(games) {
      let streak = 0;

      for (const game of games) {
        if (Number(game.stat.hits || 0) > 0) {
          streak++;
        } else {
          break;
        }
      }

      return streak;
    }

    loadPlayer().catch(err => {
      console.error(err);
      document.getElementById("playerHero").innerHTML = "<div>Could not load this player.</div>";
      document.getElementById("gameLog").innerHTML = "Could not load player stats.";
    });
  </script>
</body>
</html>
